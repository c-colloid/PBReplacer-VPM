<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PBReplacer - VPM Listing</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="./favicon.ico">
</head>
<body>
  <main class="content">
    <header id="listingHeader">
      <div class="bannerImage" id="bannerImage" hidden></div>
      <h1 id="listingName">&nbsp;</h1>
      <p class="caption" id="listingDescription"></p>
      <p class="caption">
        <span id="publishedBy"></span>
        <span id="infoLinkWrap" hidden> · <a id="infoLink" target="_blank" rel="noopener"></a></span>
      </p>
    </header>

    <section class="addToVccBlock">
      <input aria-label="VPM Listing URL" id="vccUrlField" class="vccUrlField" readonly value="">
      <a class="btn btn-accent" id="vccAddRepoButton" role="button" aria-disabled="true">Add to VCC</a>
      <button class="btn" id="vccUrlFieldCopy" disabled>Copy</button>
    </section>
    <p class="caption help-line">
      If the button doesn't open VRChat Creator Companion, copy the URL above and add it manually:
      VCC → Settings → Packages → Add Repository
    </p>

    <section id="packages"></section>

    <div id="loadError" class="error-box" hidden>
      Failed to load the package listing (index.json). Please try reloading the page.
    </div>

    <footer class="caption footer">
      <a id="footerRepoLink" target="_blank" rel="noopener" hidden>Source repository</a>
    </footer>
  </main>
  <div id="copyToast" class="toast" hidden>Copied!</div>
  <script src="app.js"></script>
</body>
</html>
